# ==============================================================================
# CONFIGURAÇÕES DA APLICAÇÃO
# ==============================================================================
spring.application.name=javanfood
spring.messages.encoding=UTF-8
# ==============================================================================
# BANCO DE DADOS & POOL (HIKARI)
# ==============================================================================
spring.datasource.url=jdbc:mysql://${db_endress:localhost}:${db_port:3306}/javanfood?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${db_user:root}
spring.datasource.password=${db_password:}
spring.datasource.hikari.connection-timeout=${hikari_connection:3000}
# ==============================================================================
# JPA / HIBERNATE
# ==============================================================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# ==============================================================================
# MIGRATIONS (FLYWAY)
# ==============================================================================
spring.flyway.locations=${flyway_root:classpath:db/migration,classpath:db/testdata}
# ==============================================================================
# SERIALIZAÇÃO (JACKSON)
# ==============================================================================
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-ignored-properties=true
# ==============================================================================
# LOGS
# ==============================================================================
logging.level.org.hibernate.tool.schema=ERROR
# ==============================================================================
# SWAGGER
# ==============================================================================
# ==============================================================================
# ENVERS
# ==============================================================================

