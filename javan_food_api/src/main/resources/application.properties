# ==============================================================================
CONFIGURAÇÕES DA APLICAÇÃO E SERVIDOR
# ==============================================================================
server.port=8081
spring.application.name=javan-food
spring.messages.encoding=UTF-8

# ==============================================================================
CONEXÃO COM O BANCO DE DADOS (POSTGRESQL)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/bd_javan_food?currentSchema=sc_javan_food&charSet=UTF-8
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
ORM HIBERNATE (JPA)
# ==============================================================================
spring.jpa.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=sc_javan_food
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
BANCO DE DADOS EVOLUTION (FLYWAY)
# ==============================================================================
spring.jpa.defer-datasource-initialization=false
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.create-schema=true
spring.flyway.schemas=sc_javan_food
spring.flyway.default-schema=sc_javan_food
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
# ==============================================================================
DOCUMENTAÇÃO DA API (SWAGGER / SPRINGDOC)
# ==============================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.displayRequestDuration=true
spring.devtools.restart.enabled=false

